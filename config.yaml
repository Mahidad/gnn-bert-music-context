task1:
  model_name: distilbert-base-uncased   # swap to bert-base-uncased for your final run
  num_tags: 50                          # top-K most frequent aspect tags used as labels
  max_length: 128                       # caption token length cap
  batch_size: 16                        # lower to 8 if you hit an out-of-memory error
  learning_rate: 0.00002
  epochs: 8
  dropout: 0.1
  seed: 42                              # keeps train/val/test split reproducible

task2:
  # --- graph construction ---
  similarity_tau: 0.85         # cosine threshold for "these segments repeat".
                               # Computed on STANDARDISED features, so the
                               # usable range is roughly 0.3-0.9, not near 1.0.
                               # Do not guess this -- run `python tune_tau.py`
                               # to pick it from your actual data.
  max_similarity_edges: 60     # cap on similarity PAIRS per graph (each pair is
                               # stored in both directions, so up to 120 entries
                               # in edge_index). Stops repetitive tracks from
                               # becoming near-fully-connected.
  build_cnn_cache: true        # also cache mel-spectrograms for the CNN baseline

  # --- GNN training ---
  # With only ~700 training graphs the GNN overfits hard: train accuracy
  # reaches 98% while validation sits near 45% and val loss climbs. The
  # settings below are deliberately heavy on regularisation.
  hidden_dim: 64               # was 128; fewer parameters to memorise with
  num_layers: 2                # 2 hops; deeper causes over-smoothing
  dropout: 0.5                 # was 0.3
  edge_dropout: 0.2            # randomly hide 20% of edges each train step
  batch_size: 32
  learning_rate: 0.001
  weight_decay: 0.005          # was 0.0005; 10x stronger L2 penalty
  epochs: 200                  # upper bound only -- early stopping ends it
  early_stopping_patience: 25  # stop after 25 epochs with no val-loss gain

  # --- CNN baseline training ---
  cnn_batch_size: 16
  cnn_learning_rate: 0.0003
  cnn_epochs: 40

  # --- splits ---
  val_frac: 0.1
  test_frac: 0.2
  seed: 42

task3:
  # --- audio -> graph (MusicCaps clips are 10s, not 30s like GTZAN) ---
  segment_seconds: 1.0         # shorter window so a 10s clip still gives
  hop_seconds: 0.5             # ~19 nodes, comparable to the GTZAN graphs
  similarity_tau: 0.3          # carried over from the Task 2 tuning
  max_similarity_edges: 60

  # --- labels ---
  num_tags: 50                 # top-K aspect tags, same vocabulary style as Task 1
                               # so Task 1 and Task 3 numbers are comparable

  # --- text ---
  model_name: distilbert-base-uncased
  max_length: 128
  caption_mode: masked         # masked | unmasked (override with --caption-mode)

  # --- model ---
  gnn_hidden: 128
  gnn_layers: 2
  gnn_dropout: 0.3
  fusion_dim: 256
  attn_heads: 4
  dropout: 0.3

  # --- training ---
  batch_size: 16
  bert_lr: 0.00002             # small LR: BERT is pretrained, nudge it gently
  head_lr: 0.0005              # larger LR: GNN + fusion head start from scratch
  weight_decay: 0.01
  epochs: 30
  early_stopping_patience: 6

  # --- splits ---
  val_frac: 0.1
  test_frac: 0.2
  seed: 42

task4:
  embed_dim: 256               # shared audio/text space
  gnn_hidden: 128
  gnn_layers: 2
  gnn_dropout: 0.3
  dropout: 0.1
  init_temperature: 0.07       # CLIP's starting value; learned from here

  batch_size: 32               # every other clip in the batch is a negative,
                               # so bigger batches give harder negatives and a
                               # sharper signal. Raise it if VRAM allows;
                               # --freeze-bert frees a lot of room.
  bert_lr: 0.00001
  head_lr: 0.0005
  weight_decay: 0.01
  epochs: 40
  early_stopping_patience: 8
